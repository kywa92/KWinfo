name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsensors-dev clang pkg-config libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsensors-dev clang pkg-config libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Smoke-test the CLI against the mock backend
        run: cargo run --locked -p kwinfo-cli -- list --mock
      - name: Replay the synthetic fixture through the real backends
        run: cargo run --locked -p kwinfo-cli -- list --replay tests/fixtures/synthetic-8700k
      - name: Read the runner's own sensors, snapshot them and replay the snapshot
        if: runner.os == 'Linux'
        run: |
          cargo run --locked -p kwinfo-cli -- list --ids
          cargo run --locked -p kwinfo-cli -- snapshot --out "$RUNNER_TEMP/snapshot"
          cargo run --locked -p kwinfo-cli -- list --replay "$RUNNER_TEMP/snapshot"

  deny:
    name: cargo-deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The files the packages install, checked without building them; release.yml builds,
  # lints and smoke-tests the packages themselves.
  packaging:
    name: packaging files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils appstream shellcheck libxml2-utils
      - name: Desktop entry
        run: desktop-file-validate packaging/desktop/io.github.kywa92.KWinfo.desktop
      - name: AppStream metadata
        run: appstreamcli validate --no-net --explain packaging/desktop/io.github.kywa92.KWinfo.metainfo.xml
      - name: D-Bus policy and polkit action
        run: xmllint --noout packaging/dbus/*.conf packaging/polkit/*.policy
      - name: Shell scripts
        run: |
          shellcheck packaging/*.sh packaging/deb/build.sh packaging/deb/postinst \
            packaging/deb/prerm packaging/deb/postrm packaging/appimage/build.sh \
            packaging/appimage/AppRun packaging/desktop/render-icons.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: Man pages match the command lines
        run: cargo xtask man --check
