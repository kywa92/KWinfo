<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- KWinfo's helper: only root owns the name; anyone may call it, and the helper
     asks polkit (io.github.kywa92.KWinfo.read-sensors) before answering. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.kywa92.KWinfo.Helper"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.kywa92.KWinfo.Helper"
           send_interface="io.github.kywa92.KWinfo.Helper1"/>
    <allow send_destination="io.github.kywa92.KWinfo.Helper"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.kywa92.KWinfo.Helper"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
