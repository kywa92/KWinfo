[package]
name = "kwinfo-core"
description = "Sensor data model, backends and sampling pipeline for KWinfo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["libsensors"]
# Labels, ignore and compute rules from lm-sensors' configuration. Linux only: the
# dependency is not built elsewhere, so the feature is a no-op on macOS. Building it on
# Linux needs `libsensors-dev` and `clang`.
libsensors = ["dep:lm-sensors"]

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
parking_lot.workspace = true
serde.workspace = true
# The private working copy a replayed recording is played into.
tempfile.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
lm-sensors = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
