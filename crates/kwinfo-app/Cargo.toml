[package]
name = "kwinfo-app"
description = "KWinfo desktop application: the Sensor Status window and sensor graphs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "kwinfo_app"
path = "src/lib.rs"

[[bin]]
name = "kwinfo"
path = "src/main.rs"

[features]
default = ["libsensors"]
# Use lm-sensors' labels and compute rules on Linux (see kwinfo-core).
libsensors = ["kwinfo-core/libsensors"]

[dependencies]
ab_glyph.workspace = true
anyhow.workspace = true
clap.workspace = true
dark-light.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
epaint_default_fonts.workspace = true
kwinfo-core.workspace = true
kwinfo-diag = { path = "../kwinfo-diag" }
kwinfo-ipc.workspace = true
parking_lot.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true
notify-rust.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
