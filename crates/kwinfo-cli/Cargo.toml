[package]
name = "kwinfo-cli"
description = "Command line companion to KWinfo: list sensors, capture fixtures, diagnose setups"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kwinfo-cli"
path = "src/main.rs"

[features]
default = ["libsensors"]
# Use lm-sensors' labels and compute rules on Linux (see kwinfo-core).
libsensors = ["kwinfo-core/libsensors"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
kwinfo-core.workspace = true
kwinfo-diag = { path = "../kwinfo-diag" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
