# cargo-deny configuration: licences, advisories, duplicate versions, sources.
# Run locally with `cargo deny check`; CI runs it on every push.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
# "Unmaintained" notices for transitive crates we cannot swap out ourselves. Revisit when
# the parent crates (epaint, zbus 5 via accesskit/dark-light) move on.
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: pulled in by epaint's font stack" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: folded into zbus; pulled in by accesskit_unix and dark-light" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: folded into zbus; pulled in by accesskit_unix and dark-light" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: folded into zbus; pulled in by accesskit_unix and dark-light" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "OFL-1.1",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "Ubuntu-font-1.0",
  "Unlicense", # ksni (StatusNotifierItem tray) # egui's bundled Ubuntu-Light font
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path dependencies carry no version on purpose
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
